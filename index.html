<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Digital Waterfall</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed WebGL stage; one quiet control dock floating bottom-left, a hint bottom-right. */
:root {
  --void: #030407;
  --ink: #e6ecf7;
  --ink-dim: #8a93a8;
  --line: rgba(160, 180, 220, 0.18);
  --glass: rgba(10, 13, 22, 0.62);
  --signal: #7fb2ff;
  --font-ui: "Geist", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--void); color: var(--ink);
  font-family: var(--font-ui); overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
#stage.dragging { cursor: grabbing; }

.tag {
  position: fixed;
  top: calc(18px + env(safe-area-inset-top, 0px));
  left: max(18px, env(safe-area-inset-left, 0px));
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px;
  background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  pointer-events: none; display: flex; gap: 10px; align-items: center;
}
.tag .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--signal); box-shadow: 0 0 10px var(--signal); }

.dock {
  position: fixed;
  left: max(18px, env(safe-area-inset-left, 0px));
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: min(300px, calc(100vw - 36px));
  background: var(--glass); border: 1px solid var(--line); border-radius: 14px;
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  font-size: 13px;
}
.dock summary {
  list-style: none; cursor: pointer; padding: 12px 14px;
  display: flex; justify-content: space-between; align-items: center;
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-dim);
}
.dock summary::-webkit-details-marker { display: none; }
.dock summary::after { content: "+"; font-size: 14px; }
.dock[open] summary::after { content: "–"; }
.dock summary:focus-visible, .dock button:focus-visible, .dock input:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
.rows { display: grid; gap: 14px; padding: 0 14px 14px; }
.row { display: grid; gap: 6px; }
.row label { display: flex; justify-content: space-between; color: var(--ink-dim); font-size: 12px; }
.row output { font-family: var(--font-mono); color: var(--ink); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--signal); margin: 0; }
.palettes { display: flex; gap: 6px; flex-wrap: wrap; }
.dock button {
  font: 500 12px var(--font-ui); color: var(--ink); background: transparent;
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 7px;
}
.dock button[aria-pressed="true"] { border-color: var(--signal); background: rgba(127, 178, 255, 0.12); }
.swatch { width: 18px; height: 8px; border-radius: 2px; }
.actions { display: flex; gap: 6px; }
.actions button { flex: 1; justify-content: center; }

.hint {
  position: fixed;
  right: max(18px, env(safe-area-inset-right, 0px));
  bottom: calc(22px + env(safe-area-inset-bottom, 0px));
  font-family: var(--font-mono); font-size: 11px; color: var(--ink-dim); letter-spacing: 0.04em;
  text-align: right; line-height: 1.7; pointer-events: none;
}
.err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--ink-dim); }
@media (max-width: 640px) { .hint { display: none; } }
</style>

<canvas id="stage" aria-label="Animated 3D waterfall of glowing light strands"></canvas>
<div class="tag"><span class="dot"></span>Digital Waterfall</div>

<details class="dock" id="dock" open>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  if (!window.THREE) {
    document.body.insertAdjacentHTML("beforeend", '<div class="err">The 3D engine could not load. Check your connection and reload the page.</div>');
    return;
  }

  // ---------- palettes ----------
  const PALETTES = {
    Aurora: { colors: ["#2f5fff", "#4f86ff", "#7fb2ff", "#b7d6ff", "#e3a250", "#f2c27c"], weights: [3, 4, 4, 2, 1.4, 0.9], haze: [0.10, 0.18, 0.42] },
    Glacier: { colors: ["#1fb6c9", "#6fe0f0", "#bff6ff", "#3a7cff", "#ffffff"], weights: [3, 3, 2, 2, 0.6], haze: [0.06, 0.22, 0.32] },
    Ember: { colors: ["#ff6a2b", "#ffa040", "#ffd28a", "#ff3d5a", "#8a5cff"], weights: [3, 3, 2, 1.2, 0.8], haze: [0.36, 0.12, 0.08] },
    Abyss: { colors: ["#1a2be0", "#2c46ff", "#4a68ff", "#7b97ff", "#b9c9ff"], weights: [3, 4, 3, 2, 0.8], haze: [0.04, 0.07, 0.42] },
    Matrix: { colors: ["#1fd17a", "#5dff9e", "#b6ffd4", "#0f8a5a"], weights: [3, 3, 1.5, 2], haze: [0.04, 0.26, 0.14] }
  };
  let paletteName = "Aurora";

  // ---------- renderer ----------
  const canvas = document.getElementById("stage");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(DPR);
  renderer.setClearColor(0x030407, 1);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(48, 1, 0.1, 200);
  const target = new THREE.Vector3(0, 4.2, 0);
  const orbit = { theta: 0, phi: 0.06, radius: 15.5, tTheta: 0, tPhi: 0.06, tRadius: 15.5 };
  const DEFAULT_ORBIT = { theta: 0, phi: 0.06, radius: 15.5 };

  // ---------- surface geometry ----------
  // Every strand lives on one shared "surface": q = sideways position, h = distance along the flow.
  // h < 0 is the wall (h = 0 at the start of the bend), then the bend, then the floor.
  // Swirls are computed in (q, h), then mapped back to 3D, so a vortex follows the wall around the bend.
  const MAX_V = 32;
  const AVG_ZW = -0.8, AVG_R = 1.2, AVG_FAN = 0.17;
  const FLOOR_END = 17;
  const H_END = Math.PI / 2 * AVG_R + (FLOOR_END - (AVG_ZW + AVG_R));

  // The rock: a lumpy boulder on the wall (a dome plus bumps and hollows), defined once and used
  // identically in JS (to trace how water runs over it) and in GLSL (to draw it).
  // Coordinates are (q, hs): sideways position and wall height measured like h.
  const ROCK = {
    q: 0, h: -6.6, rx: 2.6, ry: 2.1, height: 1.9,
    //        u      v     radius  amount  (negative amount = hollow)
    bumps: [[-0.45, -0.30, 0.32, 0.50], [0.42, -0.35, 0.30, 0.45], [0.05, 0.10, 0.33, 0.55],
            [-0.50, 0.35, 0.26, 0.40], [0.52, 0.30, 0.28, 0.48], [0.00, -0.60, 0.22, 0.25],
            [-0.15, -0.10, 0.16, -0.30], [0.25, 0.05, 0.14, -0.28], [-0.20, 0.50, 0.15, -0.25]]
  };
  const ROCK_BASE = -1.75;   // the rock sits on a plane just behind the deepest strands
  const GRAV = 2.0;          // how quickly water peels away from the rock's underside
  function rockH(q, hs) {
    const u = (q - ROCK.q) / ROCK.rx, v = (hs - ROCK.h) / ROCK.ry;
    const ang = Math.atan2(v, u + 1e-5);
    const k = 1 + 0.12 * Math.sin(3 * ang + 1.3) + 0.07 * Math.sin(5 * ang + 0.4) + 0.04 * Math.sin(9 * ang + 2);
    const base = 1 - (u * u + v * v) / (k * k);
    if (base <= 0) return 0;
    let h = Math.sqrt(base) * 0.9;
    for (const b of ROCK.bumps) { const du = u - b[0], dv = v - b[1]; h += b[3] * Math.exp(-(du * du + dv * dv) / (b[2] * b[2])); }
    return Math.max(h, 0) * Math.min(1, base / 0.12) * ROCK.height;
  }
  const F = (x) => x.toFixed(4);
  const ROCK_GLSL = `
      uniform float uStoneOn;
      float rockH(vec2 p) {
        float u = (p.x - ${F(ROCK.q)}) / ${F(ROCK.rx)};
        float v = (p.y - ${F(ROCK.h)}) / ${F(ROCK.ry)};
        float ang = atan(v, u + 1e-5);
        float k = 1.0 + 0.12 * sin(3.0 * ang + 1.3) + 0.07 * sin(5.0 * ang + 0.4) + 0.04 * sin(9.0 * ang + 2.0);
        float base = 1.0 - (u * u + v * v) / (k * k);
        if (base <= 0.0) return 0.0;
        float h = sqrt(base) * 0.9;
        float du; float dv;
        ${ROCK.bumps.map((b) => `du = u - (${F(b[0])}); dv = v - (${F(b[1])}); h += ${F(b[3])} * exp(-(du * du + dv * dv) / ${F(b[2] * b[2])});`).join("\n        ")}
        return max(h, 0.0) * min(1.0, base / 0.12) * ${F(ROCK.height)};
      }
  `;

  const vortexData = [];
  for (let i = 0; i < MAX_V; i++) vortexData.push(new THREE.Vector4(0, -999, 0, 1));

  const uniforms = {
    uTime: { value: 0 },
    uFlow: { value: 0 },
    uCursor: { value: new THREE.Vector2(0, -999) },
    uMouseOn: { value: 0 },
    uBurst: { value: new THREE.Vector4(0, -100, 0, -100) },
    uHaze: { value: new THREE.Vector3(0.1, 0.18, 0.42) },
    uV: { value: vortexData },
    uStoneOn: { value: 1 }
  };

  const strandMat = new THREE.ShaderMaterial({
    uniforms,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      #define MAX_V ${MAX_V}
      // per-vertex data packed into 7 inputs (many GPUs refuse to draw with 16)
      attribute vec2 aQH; attribute vec4 aStrand; attribute vec2 aSU;
      attribute vec3 aColor; attribute vec3 aAnim; attribute vec3 aRock;
      #define aQ aQH.x
      #define aH aQH.y
      #define aZw aStrand.x
      #define aR aStrand.y
      #define aFan aStrand.z
      #define aSeed aStrand.w
      #define aS aSU.x
      #define aU aSU.y
      #define aBright aAnim.x
      #define aSpeed aAnim.y
      #define aPhase0 aAnim.z
      #define aDq aRock.x
      #define aZ aRock.y
      #define aFroth aRock.z
      uniform vec4 uV[MAX_V];           // x = q, y = h, z = twist (radians, signed), w = radius
      uniform vec2 uCursor; uniform float uMouseOn;
      uniform vec4 uBurst; uniform float uTime; uniform float uFlow;
      varying float vThin;
      varying float vS; varying float vU; varying float vSeed; varying vec3 vColor;
      varying float vBright; varying float vGlow; varying float vBurst; varying float vPhase;

      ${ROCK_GLSL}
      vec3 surface(float q, float h) {
        float hb = 1.5707963 * aR;
        if (h < 0.0) return vec3(q, aR - h, aZw);
        if (h < hb) { float a = h / aR; return vec3(q, aR - sin(a) * aR, aZw + aR - cos(a) * aR); }
        float k = h - hb;
        return vec3(q * (1.0 + k * aFan), 0.0, aZw + aR + k);
      }

      void main() {
        vec2 p = vec2(aQ, aH);
        float energy = 0.0;
        // traced path over the rock: sideways drift into the hollows, plus churning froth where it lands
        float froth = aFroth * uStoneOn;
        p.x += aDq * uStoneOn;
        p += vec2(sin(aH * 23.0 + aSeed * 60.0 + uTime * 1.5), cos(aH * 17.0 + aSeed * 40.0 - uTime * 1.2)) * 0.1 * froth;
        for (int i = 0; i < MAX_V; i++) {
          vec4 v = uV[i];
          if (v.z == 0.0) continue;
          vec2 d = p - v.xy;
          float r2 = dot(d, d) / (v.w * v.w);
          if (r2 > 9.0) continue;
          float fall = exp(-r2);
          // 1. twirl: strands near the centre wrap further round than outer ones (never crossing)
          float a = v.z * fall;
          float c = cos(a), s = sin(a);
          d = vec2(c * d.x - s * d.y, s * d.x + c * d.y);
          // 2. open a dark eye: push strands out of the core so they curve around a hollow centre
          float r = length(d);
          float strength = min(abs(v.z) / 6.0, 1.0);
          float eye = 0.5 * v.w * strength;
          float g = exp(-r * r / (2.6 * v.w * v.w));
          float rNew = sqrt(r * r + eye * eye * g);
          d *= rNew / max(r, 1e-4);
          p = v.xy + d;
          energy += strength * fall * 1.4;
        }
        vec3 pos = surface(p.x, p.y);
        if (uStoneOn > 0.5 && aH < 0.0) {
          pos.z = max(pos.z, aZ);   // the traced water surface (clinging, or arcing clear of the rock)
          // if a swirl drags this point somewhere else on the rock, keep it on top of the rock
          float rh = rockH(vec2(p.x, p.y - aR + ${AVG_R.toFixed(2)}));
          if (rh > 0.001) pos.z = max(pos.z, ${F(ROCK_BASE)} + rh + 0.05 + (aZw + 1.6) * 0.1);
        }

        vec2 dc = vec2(aQ, aH) - uCursor;
        vGlow = exp(-dot(dc, dc) / 0.15) * uMouseOn * 0.15 + froth * 0.6;
        vThin = min(energy, 3.0);   // how hard the swirls are pulling here

        float age = uTime - uBurst.w;
        float db = distance(pos, uBurst.xyz);
        vBurst = exp(-pow(db - age * 7.0, 2.0) * 1.6) * exp(-age * 0.7) * step(0.0, age);

        vS = aS; vU = aU; vSeed = aSeed; vColor = aColor; vBright = aBright;
        vPhase = aPhase0 + uFlow * aSpeed;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }`,
    fragmentShader: `
      varying float vThin;
      varying float vS; varying float vU; varying float vSeed; varying vec3 vColor;
      varying float vBright; varying float vGlow; varying float vBurst; varying float vPhase;
      void main() {
        float freq = 0.07 + vSeed * 0.07;
        float f = fract(vS * freq - vPhase + vSeed * 13.7);
        float head = pow(f, 18.0) * smoothstep(1.0, 0.975, f);
        float streak = pow(f, 4.0) * 0.32;
        float fade = smoothstep(0.0, 0.16, vU) * (1.0 - smoothstep(0.8, 1.0, vU));
        // tiny droplets beaded along the strands, travelling with the current
        float bc = vS * 4.0 - vPhase * 6.0 + vSeed * 31.0;
        float cell = floor(bc);
        float rnd = fract(sin(cell * 91.7 + vSeed * 417.3) * 43758.5453);
        float bead = step(0.9, rnd) * smoothstep(0.1, 0.0, abs(fract(bc) - 0.5));
        // solid, continuously lit strands with softer light running through them
        vec3 col = vColor * (0.2 + streak * 0.7 + head * 1.1) + vec3(1.0) * head * 0.22;
        col += vColor * vGlow * (0.45 + head * 1.5) + vec3(0.75, 0.88, 1.0) * vBurst * 0.9;
        col += mix(vColor, vec3(1.0), 0.5) * bead * (0.08 + vGlow * 0.6);
        // inside a swirl the water thins out: most strands drop away and the rest dim
        float cut = vThin * 0.6;
        float keep = smoothstep(cut - 0.06, cut + 0.06, vSeed) * (1.0 - min(vThin, 1.0) * 0.4);
        col *= fade * vBright * keep;
        gl_FragColor = vec4(col, 1.0);
      }`
  });

  let strands = null;

  function pickColor(pal, rnd) {
    const total = pal.weights.reduce((a, b) => a + b, 0);
    let x = rnd * total;
    for (let i = 0; i < pal.colors.length; i++) { x -= pal.weights[i]; if (x <= 0) return pal.colors[i]; }
    return pal.colors[0];
  }
  function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  function buildStrands(count) {
    if (strands) { scene.remove(strands); strands.geometry.dispose(); }
    const rand = mulberry(1337);
    const pal = PALETTES[paletteName];
    const V = 230, B = 20, FL = 120;    // fine sampling on the wall, where the rock and swirls need it
    const per = V + B + FL + 1;
    const n = count * per;
    const A = (k) => new Float32Array(n * k);
    const pos = A(3), aQ = A(1), aH = A(1), aZw = A(1), aR = A(1), aFan = A(1);
    const aS = A(1), aU = A(1), aSeed = A(1), aCol = A(3), aBright = A(1), aSpeed = A(1), aPhase0 = A(1);
    const aDq = A(1), aZ = A(1), aFr = A(1);
    const idx = new Uint32Array(count * (per - 1) * 2);
    const c = new THREE.Color();
    let ii = 0;

    for (let s = 0; s < count; s++) {
      let x;
      if (rand() < 0.6) { const g = (rand() + rand() + rand() - 1.5) / 1.5; x = g * 5.2; }
      else x = (rand() - 0.5) * 11.5;
      const zw = -rand() * 1.6;
      const R = 0.9 + rand() * 0.6;
      const fan = 0.14 + rand() * 0.06;
      const seed = rand();
      c.set(pickColor(pal, rand()));
      const bright = 0.8 * (0.45 + 0.75 * Math.exp(-x * x / 14)) * (0.55 + rand() * 0.6) * (1 - Math.max(0, Math.abs(x) - 4.5) * 0.25);
      const speed = 0.35 + rand() * 0.45 + seed * 0.2;
      const phase0 = rand() * 10;
      const topY = 15.5 - rand() * 3.5;

      const hb = Math.PI / 2 * R;
      const hStart = -(topY - R);
      const hEnd = hb + (FLOOR_END - (zw + R));
      const hs = [];
      for (let i = 0; i <= V; i++) hs.push(hStart * (1 - i / V));
      for (let i = 1; i <= B; i++) hs.push(hb * i / B);
      for (let i = 1; i <= FL; i++) hs.push(hb + (hEnd - hb) * i / FL);

      // ---- trace this strand of water down the wall and over the rock ----
      const dq = new Float32Array(per), zz = new Float32Array(per).fill(-100), fr = new Float32Array(per);
      const layer = 0.05 + (zw + 1.6) * 0.1;   // keeps front strands in front, even on the rock
      let q = x, zW = zw, vz = 0, frothE = 0;
      for (let i = 0; i <= V; i++) {
        const hsw = hs[i] - R + AVG_R;
        if (i > 0) {
          const dh = hs[i] - hs[i - 1];
          const H0 = rockH(q, hsw);
          const touching = H0 > 0.001 && zW <= ROCK_BASE + H0 + layer + 0.03;
          if (touching) {
            // water on the rock runs sideways off the bumps and gathers in the hollows
            const gq = (rockH(q + 0.03, hsw) - rockH(q - 0.03, hsw)) / 0.06;
            q -= Math.max(-3, Math.min(3, gq)) * 0.9 * dh;
          } else if (H0 <= 0.001 && zW <= zw + 0.01) {
            q += (x - q) * Math.min(1, 0.04 * dh);   // back on the wall, rivulets slowly spread out again
          }
          const Hn = rockH(q, hsw);
          const surfaceZ = Math.max(zw, Hn > 0.001 ? ROCK_BASE + Hn + layer : -100);
          const ballistic = zW + vz * dh - 0.5 * GRAV * dh * dh;
          if (surfaceZ >= ballistic) {
            // clinging to the rock (or the wall); climbing never builds upward momentum
            const rise = surfaceZ - zW;
            if (rise > 0 && Hn > 0.001) frothE = Math.min(1, frothE + rise * 1.1);
            vz = Math.min(0, rise / dh);
            zW = surfaceZ;
          } else {
            // the rock falls away faster than the water can follow: it arcs off into the air
            zW = ballistic;
            vz -= GRAV * dh;
          }
          frothE *= Math.exp(-dh * 2.4);
        }
        dq[i] = q - x; zz[i] = zW; fr[i] = frothE;
      }
      for (let i = V + 1; i < per; i++) dq[i] = dq[V] * Math.exp(-(i - V) / 40);

      const base = s * per;
      for (let i = 0; i < per; i++) {
        const h = hs[i], vi = base + i;
        let px, py, pz;
        if (h < 0) { px = x; py = R - h; pz = zw; }
        else if (h < hb) { const a = h / R; px = x; py = R - Math.sin(a) * R; pz = zw + R - Math.cos(a) * R; }
        else { const k = h - hb; px = x * (1 + k * fan); py = 0; pz = zw + R + k; }
        pos[vi * 3] = px; pos[vi * 3 + 1] = py; pos[vi * 3 + 2] = pz;
        aQ[vi] = x; aH[vi] = h; aZw[vi] = zw; aR[vi] = R; aFan[vi] = fan;
        aS[vi] = h - hStart; aU[vi] = (h - hStart) / (hEnd - hStart); aSeed[vi] = seed;
        aCol[vi * 3] = c.r; aCol[vi * 3 + 1] = c.g; aCol[vi * 3 + 2] = c.b;
        aBright[vi] = bright; aSpeed[vi] = speed; aPhase0[vi] = phase0;
        aDq[vi] = dq[i]; aZ[vi] = zz[i]; aFr[vi] = fr[i];
        if (i < per - 1) { idx[ii++] = vi; idx[ii++] = vi + 1; }
      }
    }
    const geo = new THREE.BufferGeometry();
    const set = (name, arr, k) => geo.setAttribute(name, new THREE.BufferAttribute(arr, k));
    const pack = (arrs) => {
      const k = arrs.length, out = new Float32Array(n * k);
      for (let i = 0; i < n; i++) for (let j = 0; j < k; j++) out[i * k + j] = arrs[j][i];
      return out;
    };
    set("position", pos, 3);
    set("aQH", pack([aQ, aH]), 2);
    set("aStrand", pack([aZw, aR, aFan, aSeed]), 4);
    set("aSU", pack([aS, aU]), 2);
    set("aColor", aCol, 3);
    set("aAnim", pack([aBright, aSpeed, aPhase0]), 3);
    set("aRock", pack([aDq, aZ, aFr]), 3);
    geo.setIndex(new THREE.BufferAttribute(idx, 1));
    strands = new THREE.LineSegments(geo, strandMat);
    strands.frustumCulled = false;
    scene.add(strands);
  }

  // ---------- haze behind the wall + floor sheen ----------
  const hazeMat = new THREE.ShaderMaterial({
    uniforms,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform vec3 uHaze; uniform float uTime; varying vec2 vUv;
      void main(){
        vec2 c = vUv - vec2(0.5, 0.42);
        float g = exp(-(c.x*c.x)/0.025) * smoothstep(1.0, 0.25, vUv.y) * smoothstep(0.0, 0.2, vUv.y);
        float shimmer = 0.85 + 0.15 * sin(vUv.x * 90.0 + uTime * 0.6) * sin(vUv.x * 37.0 - uTime * 0.4);
        gl_FragColor = vec4(uHaze * g * shimmer * 0.55, 1.0);
      }`
  });
  const haze = new THREE.Mesh(new THREE.PlaneGeometry(18, 17), hazeMat);
  haze.position.set(0, 7.5, -2.2);
  scene.add(haze);

  const floorMat = new THREE.ShaderMaterial({
    uniforms,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
    fragmentShader: `
      uniform vec3 uHaze; varying vec2 vUv;
      void main(){
        vec2 c = vUv - vec2(0.5, 0.92);
        float g = exp(-(c.x*c.x)/0.06 - (c.y*c.y)/0.05);
        gl_FragColor = vec4(uHaze * g * 0.5, 1.0);
      }`
  });
  const floorGlow = new THREE.Mesh(new THREE.PlaneGeometry(26, 20), floorMat);
  floorGlow.rotation.x = -Math.PI / 2;
  floorGlow.position.set(0, -0.02, 8);
  scene.add(floorGlow);

  // ---------- the stone ----------
  const stoneGeo = new THREE.PlaneGeometry(ROCK.rx * 2.8, ROCK.ry * 2.8, 180, 180);
  stoneGeo.translate(ROCK.q, AVG_R - ROCK.h, 0);
  const stoneMat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader: `
      ${ROCK_GLSL}
      varying vec3 vN; varying vec3 vW; varying float vP; varying vec2 vSp;
      void main() {
        vec2 sp = vec2(position.x, ${AVG_R.toFixed(2)} - position.y);
        float e = 0.03;
        vP = rockH(sp);
        float z = ${F(ROCK_BASE)} + vP;
        vec3 tx = vec3(e, 0.0, rockH(sp + vec2(e, 0.0)) - vP);
        vec3 ty = vec3(0.0, -e, rockH(sp + vec2(0.0, e)) - vP);
        vN = normalize(cross(ty, tx));
        vSp = sp;
        vW = vec3(position.x, position.y, z);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(vW, 1.0);
      }`,
    fragmentShader: `
      uniform vec3 uHaze;
      varying vec3 vN; varying vec3 vW; varying float vP; varying vec2 vSp;
      void main() {
        if (vP < 0.002) discard;
        vec3 N = normalize(vN);
        vec3 V = normalize(cameraPosition - vW);
        float rim = pow(1.0 - max(dot(N, V), 0.0), 2.5);
        float grain = 0.5 + 0.5 * sin(vSp.x * 13.0 + sin(vSp.y * 9.0) * 2.0) * sin(vSp.y * 11.0 + vSp.x * 3.0);
        float top = max(N.y, 0.0);
        float cavity = smoothstep(0.0, 1.2, vP);   // deeper, darker where the rock is low
        vec3 col = vec3(0.008, 0.01, 0.02) * (0.6 + grain * 0.8) + uHaze * (rim * 0.7 + top * 0.25) * (0.4 + 0.6 * grain) * (0.35 + 0.65 * cavity);
        gl_FragColor = vec4(col, 1.0);
      }`
  });
  const stone = new THREE.Mesh(stoneGeo, stoneMat);
  stone.frustumCulled = false;
  scene.add(stone);


  // ---------- hand-rolled bloom ----------
  const quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quadScene = new THREE.Scene();
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
  quadScene.add(quad);
  const rtOpts = { minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, format: THREE.RGBAFormat, type: THREE.HalfFloatType };
  const rtMain = new THREE.WebGLRenderTarget(1, 1, rtOpts);
  const rtA = new THREE.WebGLRenderTarget(1, 1, rtOpts);
  const rtB = new THREE.WebGLRenderTarget(1, 1, rtOpts);
  const rtC = new THREE.WebGLRenderTarget(1, 1, rtOpts);
  const rtD = new THREE.WebGLRenderTarget(1, 1, rtOpts);

  const quadVS = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
  const blurMat = new THREE.ShaderMaterial({
    uniforms: { tSrc: { value: null }, uDir: { value: new THREE.Vector2() }, uBright: { value: 0 } },
    vertexShader: quadVS,
    fragmentShader: `
      uniform sampler2D tSrc; uniform vec2 uDir; uniform float uBright; varying vec2 vUv;
      void main(){
        vec3 s = texture2D(tSrc, vUv).rgb * 0.227027;
        s += texture2D(tSrc, vUv + uDir * 1.3846).rgb * 0.3162162;
        s += texture2D(tSrc, vUv - uDir * 1.3846).rgb * 0.3162162;
        s += texture2D(tSrc, vUv + uDir * 3.2308).rgb * 0.0702703;
        s += texture2D(tSrc, vUv - uDir * 3.2308).rgb * 0.0702703;
        if (uBright > 0.0) s = max(s - vec3(0.04), 0.0) * 1.15;
        gl_FragColor = vec4(s, 1.0);
      }`
  });
  const compMat = new THREE.ShaderMaterial({
    uniforms: { tMain: { value: null }, tBloomA: { value: null }, tBloomB: { value: null }, uStrength: { value: 1 } },
    vertexShader: quadVS,
    fragmentShader: `
      uniform sampler2D tMain, tBloomA, tBloomB; uniform float uStrength; varying vec2 vUv;
      void main(){
        vec3 c = texture2D(tMain, vUv).rgb;
        vec3 b = texture2D(tBloomA, vUv).rgb * 1.1 + texture2D(tBloomB, vUv).rgb * 1.4;
        c += b * uStrength;
        c = vec3(1.0) - exp(-c * 1.35);
        vec2 v = vUv - 0.5; c *= 1.0 - dot(v, v) * 0.9;
        gl_FragColor = vec4(c, 1.0);
      }`
  });

  function blurPass(src, dst, dx, dy, bright) {
    quad.material = blurMat;
    blurMat.uniforms.tSrc.value = src.texture;
    blurMat.uniforms.uDir.value.set(dx / dst.width, dy / dst.height);
    blurMat.uniforms.uBright.value = bright ? 1 : 0;
    renderer.setRenderTarget(dst);
    renderer.render(quadScene, quadCam);
  }

  const glow = 0.6;   // locked
  function render() {
    renderer.setRenderTarget(rtMain);
    renderer.render(scene, camera);
    quad.material = compMat;
    compMat.uniforms.tMain.value = rtMain.texture;
    if (glow <= 0.001) {
      compMat.uniforms.tBloomA.value = rtMain.texture;
      compMat.uniforms.tBloomB.value = rtMain.texture;
      compMat.uniforms.uStrength.value = 0;
    } else {
      blurPass(rtMain, rtA, 1, 0, true);
      blurPass(rtA, rtB, 0, 1, false);
      blurPass(rtB, rtC, 1.5, 0, false);
      blurPass(rtC, rtD, 0, 1.5, false);
      blurPass(rtD, rtC, 2.5, 0, false);
      blurPass(rtC, rtD, 0, 2.5, false);
      quad.material = compMat;
      compMat.uniforms.tBloomA.value = rtB.texture;
      compMat.uniforms.tBloomB.value = rtD.texture;
      compMat.uniforms.uStrength.value = glow;
    }
    renderer.setRenderTarget(null);
    renderer.render(quadScene, quadCam);
  }

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.fov = w / h < 0.8 ? 64 : 48;
    camera.updateProjectionMatrix();
    const W = Math.floor(w * DPR), H = Math.floor(h * DPR);
    rtMain.setSize(W, H);
    rtA.setSize(W >> 1, H >> 1); rtB.setSize(W >> 1, H >> 1);
    rtC.setSize(W >> 2, H >> 2); rtD.setSize(W >> 2, H >> 2);
  }
  window.addEventListener("resize", resize);

  // ---------- vortices ----------
  // Slot 0 is the swirl under the cursor. The rest are swirls it sheds, which ride the current downstream.
  const shed = [];               // { q, h, twist, r0, age, life }
  const cursor = { q: 0, h: -999, on: false, lastQ: 0, vel: 0, dir: 1, shedT: 0, flip: 1 };
  const swirlAmt = 1.0;   // locked
  let cursorTwist = 0;

  function spawn(q, h, twist, r0, life) {
    if (shed.length >= MAX_V - 1) shed.shift();
    shed.push({ q, h, twist, r0, age: 0, life });
  }

  function updateVortices(dt, flowSpeed) {
    const drift = 2.6 * flowSpeed;              // how fast swirls travel with the water
    // cursor swirl: strength eases in while hovering, direction follows sideways motion
    // the swirl winds up while you hover (to about 1.3 full turns at its centre)
    cursorTwist += ((cursor.on ? 7.5 * cursor.dir : 0) - cursorTwist) * Math.min(1, dt * (cursor.on ? 1.4 : 2.5));
    // shed a new swirl downstream at a steady rhythm, alternating spin like water behind a rock
    if (cursor.on && flowSpeed > 0.02) {
      cursor.shedT += dt * (0.35 + flowSpeed * 0.6 + Math.min(cursor.vel, 6) * 0.25);
      if (cursor.shedT > 1) {
        cursor.shedT = 0;
        cursor.flip *= -1;
        const spin = cursor.flip * (1 + Math.min(cursor.vel, 4) * 0.1);
        spawn(cursor.q + (Math.random() - 0.5) * 0.3, cursor.h + 0.8, spin * 6.5, 0.55 + Math.random() * 0.2, 6 + Math.random() * 2);
      }
    }
    cursor.vel *= Math.exp(-dt * 3);

    for (let i = shed.length - 1; i >= 0; i--) {
      const v = shed[i];
      v.age += dt;
      v.h += drift * dt * (v.h > 0 ? 1.25 : 1);   // a bit faster once it reaches the floor
      v.q += Math.sin(v.age * 1.7 + v.r0 * 10) * dt * 0.25;
      if (v.age > v.life || v.h > H_END + 2) shed.splice(i, 1);
    }

    vortexData[0].set(cursor.q, cursor.h, cursorTwist * swirlAmt, 0.7);
    for (let i = 1; i < MAX_V; i++) {
      const v = shed[i - 1];
      if (!v) { vortexData[i].z = 0; continue; }
      const inF = Math.min(1, v.age / 0.5);
      const k = v.age / v.life;
      const outF = k < 0.6 ? 1 : 1 - (k - 0.6) / 0.4;   // hold full strength, then unwind
      vortexData[i].set(v.q, v.h, v.twist * inF * outF * swirlAmt, v.r0 + v.age * 0.1);
    }
  }

  // ---------- interaction ----------
  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  const wallPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -AVG_ZW);
  const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const hitW = new THREE.Vector3(), hitF = new THREE.Vector3();

  // screen point -> {world, q, h} on the shared surface
  function surfacePoint(ev) {
    const r = canvas.getBoundingClientRect();
    ndc.set(((ev.clientX - r.left) / r.width) * 2 - 1, -((ev.clientY - r.top) / r.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const w = raycaster.ray.intersectPlane(wallPlane, hitW);
    if (w && w.y > AVG_R) return { world: hitW.clone(), q: hitW.x, h: AVG_R - hitW.y };
    const f = raycaster.ray.intersectPlane(floorPlane, hitF);
    if (f) {
      const k = Math.max(0, hitF.z - (AVG_ZW + AVG_R));
      return { world: hitF.clone(), q: hitF.x / (1 + k * AVG_FAN), h: Math.PI / 2 * AVG_R + k };
    }
    return null;
  }

  let drag = null;
  let lastMoveT = performance.now();
  canvas.addEventListener("pointerdown", (e) => {
    drag = { x: e.clientX, y: e.clientY, th: orbit.tTheta, ph: orbit.tPhi, moved: false, id: e.pointerId };
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (drag && drag.id === e.pointerId) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 6) { drag.moved = true; canvas.classList.add("dragging"); }
      if (drag.moved) {
        orbit.tTheta = Math.max(-0.75, Math.min(0.75, drag.th - dx * 0.004));
        orbit.tPhi = Math.max(-0.12, Math.min(0.62, drag.ph + dy * 0.003));
        cursor.on = false;
        return;
      }
    }
    const p = surfacePoint(e);
    const now = performance.now();
    if (p && p.h < H_END - 1) {
      const dt = Math.max(1, now - lastMoveT) / 1000;
      if (cursor.on) {
        const dq = p.q - cursor.q, dh = p.h - cursor.h;
        cursor.vel = Math.max(cursor.vel, Math.hypot(dq, dh) / dt * 0.1);
        if (Math.abs(dq) > 0.02) cursor.dir = dq > 0 ? -1 : 1;   // spin the way the hand is moving
      }
      cursor.q = p.q; cursor.h = p.h; cursor.on = true;
    } else cursor.on = false;
    lastMoveT = now;
  });
  function endDrag(e) {
    if (!drag) return;
    if (!drag.moved) {
      const p = surfacePoint(e);
      if (p) {
        uniforms.uBurst.value.set(p.world.x, p.world.y, p.world.z, uniforms.uTime.value);
        spawn(p.q, p.h, (cursor.dir || 1) * 10, 3.0, 8);   // a big whirlpool that rides the flow
      }
    }
    canvas.classList.remove("dragging");
    drag = null;
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", () => { drag = null; canvas.classList.remove("dragging"); });
  canvas.addEventListener("pointerleave", () => { cursor.on = false; });
  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    orbit.tRadius = Math.max(8, Math.min(26, orbit.tRadius * (1 + Math.sign(e.deltaY) * 0.08)));
  }, { passive: false });

  // ---------- controls ----------
  const $ = (id) => document.getElementById(id);
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fmtX = (v) => (Math.round(v * 100) / 100) + "×";
  // Locked settings: flow speed 0.4×, swirl strength 1.0, 500 strands, glow 0.6
  const speed = 0.4;

  const small = Math.min(window.innerWidth, window.innerHeight) < 600;
  const count = 500;

  const palWrap = $("palettes");
  Object.keys(PALETTES).forEach((name) => {
    const b = document.createElement("button");
    b.type = "button"; b.id = "pal-" + name.toLowerCase();
    b.setAttribute("aria-pressed", name === paletteName);
    const p = PALETTES[name];
    b.innerHTML = `<span class="swatch" style="background:linear-gradient(90deg,${p.colors.slice(0, 4).join(",")})"></span>${name}`;
    b.addEventListener("click", () => {
      paletteName = name;
      palWrap.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
      uniforms.uHaze.value.set(...p.haze);
      buildStrands(count);
    });
    palWrap.appendChild(b);
  });

  let paused = false;
  $("pause").addEventListener("click", (e) => {
    paused = !paused;
    e.currentTarget.setAttribute("aria-pressed", paused);
    e.currentTarget.textContent = paused ? "Play" : "Pause";
  });
  $("stoneBtn").addEventListener("click", (e) => {
    const on = uniforms.uStoneOn.value < 0.5;
    uniforms.uStoneOn.value = on ? 1 : 0;
    stone.visible = on;
    e.currentTarget.setAttribute("aria-pressed", on);
  });
  $("reset").addEventListener("click", () => { orbit.tTheta = DEFAULT_ORBIT.theta; orbit.tPhi = DEFAULT_ORBIT.phi; orbit.tRadius = DEFAULT_ORBIT.radius; });
  if (small) $("dock").open = false;

  // ---------- loop ----------
  buildStrands(count);
  resize();
  const clock = new THREE.Clock();
  let t = 0, flow = 0, checkedGPU = false;
  function frame() {
    const dt = Math.min(clock.getDelta(), 0.05);
    if (!paused) {
      t += dt;
      flow += dt * speed * 0.9;        // integrated, so changing speed never makes the streaks jump
      updateVortices(dt, speed);
    }
    uniforms.uTime.value = t;
    uniforms.uFlow.value = flow;
    uniforms.uCursor.value.set(cursor.q, cursor.h);
    uniforms.uMouseOn.value += ((cursor.on ? 1 : 0) - uniforms.uMouseOn.value) * 0.08;

    const drift = paused || reduceMotion ? 0 : Math.sin(t * 0.12) * 0.04;
    orbit.theta += (orbit.tTheta + drift - orbit.theta) * 0.07;
    orbit.phi += (orbit.tPhi - orbit.phi) * 0.07;
    orbit.radius += (orbit.tRadius - orbit.radius) * 0.07;
    camera.position.set(
      target.x + orbit.radius * Math.sin(orbit.theta) * Math.cos(orbit.phi),
      target.y - 1.6 + orbit.radius * Math.sin(orbit.phi),
      target.z + orbit.radius * Math.cos(orbit.theta) * Math.cos(orbit.phi)
    );
    camera.lookAt(target);

    render();
    if (!checkedGPU) {
      checkedGPU = true;
      const failed = (renderer.info.programs || []).some((p) => p.diagnostics && !p.diagnostics.runnable);
      if (failed) document.body.insertAdjacentHTML("beforeend", '<div class="err">This device\'s graphics could not draw the strands. Try another browser, or update your graphics drivers.</div>');
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>
